<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #1B1916; background: #F5F3EE; font-variant-numeric: tabular-nums; }
    a { color: #1B1916; } a:hover { color: #57524A; }
    button { font-family: inherit; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; box-sizing: border-box; background: #F5F3EE; overflow: hidden;">
  <div style="box-sizing: border-box; padding: 12px 16px 120px; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; align-items: center; gap: 10px; height: 48px;">
      <a href="Online-1-servico.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #E2DCD1; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1916" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 600;">Barbearia Modelo</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #57524A;"><span><strong style="color: #1B1916;">Passo 2 de 4</strong> · Profissional</span><span>Corte degradê · 45 min</span></div>
      <div style="height: 4px; border-radius: 2px; background: #E7E2D8;"><div style="width: 50%; height: 100%; border-radius: 2px; background: {{accent}};"></div></div>
    </div>

    <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700;">Com quem você quer cortar?</h2>

    <div role="radiogroup" aria-label="Profissional" style="display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{barbers}}" as="b" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{b.on}}" onClick="{{b.pick}}" style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; border: {{b.border}}; background: {{b.bg}}; color: #1B1916; text-align: left; cursor: pointer;">
          <div style="width: 56px; height: 56px; border-radius: 50%; background: {{b.avatarBg}}; color: {{b.avatarFg}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{b.initials}}</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 16px; font-weight: 600;">{{b.name}}</span>
            <span style="font-size: 13px; color: #6F685D;">{{b.about}}</span>
            <span style="font-size: 13px; font-weight: 600; color: {{b.nextColor}};">{{b.next}}</span>
          </div>
          <span style="width: 24px; height: 24px; border-radius: 50%; border: {{b.radioBorder}}; box-sizing: border-box; flex-shrink: 0;"></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 22px; background: #FFFFFF; border-top: 1px solid #E7E2D8; display: flex; align-items: center; gap: 12px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 16px; font-weight: 700;">R$ 55</span>
      <span style="font-size: 12px; color: #6F685D;">{{summary}}</span>
    </div>
    <a href="Online-3-horario.dc.html" style="height: 52px; padding: 0 26px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; text-decoration: none;">Continuar</a>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#C94F0C","options":["#C94F0C","#A16207","#2F6B4F","#1F4E8C"],"section":"Marca"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { barber: 'DR' };
  }
  renderVals() {
    const raw = this.props.accent ?? '#C94F0C';
    const accent = /^#[0-9a-fA-F]{6}$/.test(raw) ? raw : '#C94F0C';
    const mix = (h, target, t) => {
      const n = parseInt(h.slice(1), 16);
      const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      return '#' + ch.map((c) => Math.round(c + (target - c) * t).toString(16).padStart(2, '0')).join('');
    };
    const list = [
      ['ANY', 'Qualquer profissional', 'Mostramos o primeiro horário livre', 'Livre hoje a partir das 14:30', '?'],
      ['DR', 'Diego Ramos', 'Degradê e barba · nota 9,4', 'Livre hoje às 15:45', 'DR'],
      ['AS', 'Anderson Silva', 'Cortes clássicos e pigmentação · nota 9,1', 'Livre hoje às 17:45', 'AS'],
      ['MT', 'Marcos Teixeira', 'Degradê e sobrancelha · nota 9,3', 'Livre hoje às 14:30', 'MT'],
      ['VP', 'Vinícius Prado', 'Cortes infantis e tesoura · nota 9,0', 'Livre hoje às 14:30', 'VP']
    ];
    const barbers = list.map(([id, name, about, next, initials]) => {
      const on = this.state.barber === id;
      return {
        name, about, next, initials, on,
        border: on ? '2px solid ' + accent : '1px solid #E7E2D8',
        bg: on ? mix(accent, 255, 0.93) : '#FFFFFF',
        avatarBg: id === 'ANY' ? '#F1EDE6' : (on ? accent : '#EFEBE3'),
        avatarFg: on && id !== 'ANY' ? '#FFFFFF' : '#57524A',
        nextColor: '#1D6B40',
        radioBorder: on ? '7px solid ' + accent : '2px solid #D8D0C2',
        pick: () => this.setState({ barber: id })
      };
    });
    const picked = list.find((l) => l[0] === this.state.barber);
    return { accent, barbers, summary: 'Corte degradê · ' + (picked[0] === 'ANY' ? 'qualquer profissional' : picked[1].split(' ')[0]) };
  }
}
</script>
</body>
</html>
