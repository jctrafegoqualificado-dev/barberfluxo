<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #1B1916; background: #F5F3EE; font-variant-numeric: tabular-nums; }
    a { color: #1B1916; } a:hover { color: #57524A; }
    button { font-family: inherit; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; box-sizing: border-box; background: #F5F3EE; overflow: hidden;">
  <div style="box-sizing: border-box; padding: 12px 16px 120px; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; align-items: center; gap: 10px; height: 48px;">
      <a href="Online-2-profissional.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #E2DCD1; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1916" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 600;">Barbearia Modelo</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #57524A;"><span><strong style="color: #1B1916;">Passo 3 de 4</strong> · Horário</span><span>Corte degradê · Diego</span></div>
      <div style="height: 4px; border-radius: 2px; background: #E7E2D8;"><div style="width: 75%; height: 100%; border-radius: 2px; background: {{accent}};"></div></div>
    </div>

    <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700;">Quando fica bom?</h2>

    <div role="radiogroup" aria-label="Dia" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{d.on}}" onClick="{{d.pick}}" style="height: 70px; border-radius: 12px; border: {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer;">
          <span style="font-size: 12px; font-weight: 600;">{{d.label}}</span>
          <span style="font-size: 18px; font-weight: 700;">{{d.day}}</span>
          <span style="font-size: 11px; opacity: 0.85;">{{d.count}}</span>
        </button>
      </sc-for>
    </div>

    <sc-for list="{{periods}}" as="p" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 14px; font-weight: 600; color: #57524A;">{{p.name}}</span>
        <div role="radiogroup" aria-label="{{p.name}}" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{p.slots}}" as="t" hint-placeholder-count="4">
            <button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="height: 48px; border-radius: 10px; border: {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 600; cursor: pointer;">{{t.label}}</button>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #FFFFFF; border: 1px dashed #D8D0C2;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#57524A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span style="flex-grow: 1; font-size: 13px; color: #57524A;">Não achou horário? Entre na lista de espera e avisamos se abrir uma vaga.</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 22px; background: #FFFFFF; border-top: 1px solid #E7E2D8; display: flex; align-items: center; gap: 12px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 16px; font-weight: 700;">{{when}}</span>
      <span style="font-size: 12px; color: #6F685D;">com Diego · R$ 55</span>
    </div>
    <a href="Online-4-dados.dc.html" style="height: 52px; padding: 0 26px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; text-decoration: none;">Continuar</a>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#C94F0C","options":["#C94F0C","#A16207","#2F6B4F","#1F4E8C"],"section":"Marca"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: '16', slot: '16:00' };
  }
  renderVals() {
    const raw = this.props.accent ?? '#C94F0C';
    const accent = /^#[0-9a-fA-F]{6}$/.test(raw) ? raw : '#C94F0C';

    const avail = {
      '16': { Tarde: ['15:45', '16:00', '16:15'], Noite: ['18:30', '18:45', '19:00', '19:15'] },
      '17': { Manhã: ['09:00', '09:15', '10:30', '11:00'], Tarde: ['13:00', '14:00', '15:30', '17:00'], Noite: ['18:15', '19:00'] },
      '18': { Manhã: ['08:30', '11:15'], Tarde: ['16:45'], Noite: ['19:15'] },
      '19': { Manhã: ['07:00', '07:15'], Tarde: [], Noite: [] },
      '21': { Manhã: ['08:00', '08:15', '08:30', '09:00'], Tarde: ['13:00', '13:15', '14:00', '15:00'], Noite: ['18:00', '18:30', '19:00'] }
    };
    const labels = { '16': 'Hoje', '17': 'Amanhã', '18': 'Sex', '19': 'Sáb', '21': 'Seg' };
    const days = Object.keys(avail).map((d) => {
      const on = this.state.day === d;
      const n = Object.values(avail[d]).reduce((a, s) => a + s.length, 0);
      return {
        label: labels[d], day: d, on, count: n + (n === 1 ? ' vaga' : ' vagas'),
        border: on ? '2px solid #1B1916' : '1px solid #E7E2D8',
        bg: on ? '#1B1916' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B1916',
        pick: () => {
          const first = Object.values(avail[d]).find((s) => s.length);
          this.setState({ day: d, slot: first ? first[0] : '' });
        }
      };
    });

    const periods = Object.entries(avail[this.state.day]).filter(([, s]) => s.length).map(([name, slots]) => ({
      name,
      slots: slots.map((label) => {
        const on = this.state.slot === label;
        return {
          label, on,
          border: on ? '2px solid ' + accent : '1px solid #D8D0C2',
          bg: on ? accent : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B1916',
          pick: () => this.setState({ slot: label })
        };
      })
    }));

    const [h, m] = (this.state.slot || '00:00').split(':').map(Number);
    const end = h * 60 + m + 45;
    const fmt = (x) => String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
    const dayName = { '16': 'Hoje', '17': 'Amanhã', '18': 'Sex, 18', '19': 'Sáb, 19', '21': 'Seg, 21' }[this.state.day];

    return { accent, days, periods, when: this.state.slot ? dayName + ', ' + this.state.slot + ' – ' + fmt(end) : 'Escolha um horário' };
  }
}
</script>
</body>
</html>
