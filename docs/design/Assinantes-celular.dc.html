<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #1B1916; background: #F5F3EE; font-variant-numeric: tabular-nums; }
    a { color: #1B1916; } a:hover { color: #57524A; }
    button { font-family: inherit; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 1400px; box-sizing: border-box; background: #F5F3EE; overflow: hidden;">
  <div style="box-sizing: border-box; padding: 16px 16px 110px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; align-items: center; justify-content: space-between; height: 48px;">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em;">Assinantes</h1>
      <button type="button" aria-label="Novo assinante" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
    </div>

    <section aria-label="Recorrência" style="background: #1B1916; color: #FFFFFF; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 13px; color: #C9C2B6;">Recorrência</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; font-weight: 700; line-height: 1.1;">R$ 6.840<span style="font-size: 16px; color: #C9C2B6;">/mês</span></span>
        <span style="font-size: 13px; color: #C9C2B6;">57 ativos · +5 novos · 2 cancelaram</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-top: 12px; border-top: 1px solid #3A352F;">
        <div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 12px; color: #C9C2B6;">Cobranças hoje</span><span style="font-size: 18px; font-weight: 700;">R$ 734</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 12px; color: #C9C2B6;">Em atraso</span><span style="font-size: 18px; font-weight: 700; color: #F2B8B0;">R$ 416</span></div>
      </div>
    </section>

    <div role="group" aria-label="Situação" style="display: flex; gap: 6px; overflow: hidden;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="flex-shrink: 0; height: 38px; padding: 0 12px; border-radius: 19px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; font-weight: 600;">{{c.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E7E2D8; border-radius: 14px; overflow: hidden;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-top: {{r.divider}};">
          <div style="display: flex; align-items: flex-start; gap: 10px;">
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 15px; font-weight: 600;">{{r.name}}</span>
              <span style="font-size: 12px; color: #6F685D;">{{r.plan}}</span>
            </div>
            <span style="height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 600; display: flex; align-items: center; white-space: nowrap; background: {{r.statusBg}}; color: {{r.statusFg}};">{{r.status}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 12px; color: #57524A;">{{r.use}} · cobra {{r.due}}</span>
              <div style="height: 5px; border-radius: 3px; background: #F1EDE6;"><div style="width: {{r.usePct}}; height: 100%; border-radius: 3px; background: #1B1916;"></div></div>
            </div>
            <sc-if value="{{r.hasAction}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-label="{{r.aria}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #1B1916; color: #FFFFFF; font-size: 13px; font-weight: 600;">{{r.action}}</button>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 12px 20px; background: #FFFFFF; border-top: 1px solid #E7E2D8; display: flex; align-items: center; justify-content: space-around;">
    <a href="Dashboard-celular.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #6F685D; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>Início</a>
    <a href="Agenda-celular.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #6F685D; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18"></path></svg>Agenda</a>
    <a href="Novo-agendamento.dc.html" aria-label="Novo agendamento" style="width: 52px; height: 52px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></a>
    <a href="Financeiro-celular.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #6F685D; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>Caixa</a>
    <a href="#" aria-current="page" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #1B1916; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>Menu</a>
  </nav>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#C94F0C","options":["#C94F0C","#A16207","#2F6B4F","#1F4E8C"],"section":"Marca"},"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { chip: 'hoje' };
  }
  renderVals() {
    const raw = this.props.accent ?? '#C94F0C';
    const accent = /^#[0-9a-fA-F]{6}$/.test(raw) ? raw : '#C94F0C';
    const chips = [['hoje', 'Cobrar hoje · 3'], ['atraso', 'Em atraso · 4'], ['ativos', 'Ativos · 57'], ['pausados', 'Pausados · 3']].map(([id, label]) => {
      const on = this.state.chip === id;
      return { label, on, bg: on ? '#1B1916' : '#FFFFFF', fg: on ? '#FFFFFF' : '#57524A', border: on ? '#1B1916' : '#E2DCD1', pick: () => this.setState({ chip: id }) };
    });
    const S = { ok: ['Em dia', '#E8F4EC', '#1D6B40'], wait: ['A pagar hoje', '#F5EEDC', '#6E5210'], failed: ['Cartão recusado', '#FBECEA', '#9B2C22'], late: ['Atrasado 6 dias', '#FBECEA', '#9B2C22'] };
    const A = { ok: '', wait: 'Dar baixa', failed: 'Novo link', late: 'Cobrar' };
    const rows = [
      ['Samuel Braga', 'Corte ilimitado · R$ 129', '3 cortes', 0, 'hoje', 'failed'],
      ['Gabriel Torres', 'Corte + barba · R$ 149', '4 de 4 cortes', 100, 'hoje', 'wait'],
      ['Ricardo Alves', 'Corte mensal · R$ 89', '1 de 2 cortes', 50, 'hoje', 'wait'],
      ['Bruno Cardoso', 'Corte + barba · R$ 149', '1 de 4 cortes', 25, '10/09', 'late'],
      ['Caio Mendes', 'Corte ilimitado · R$ 129', '2 cortes', 0, '16/10', 'ok'],
      ['Leandro Souza', 'Corte + barba · R$ 149', '3 de 4 cortes', 75, '16/10', 'ok'],
      ['Thiago Rocha', 'Barba em dia · R$ 70', '3 de 4 barbas', 75, '02/10', 'ok']
    ].map(([name, plan, use, pct, due, st], i) => ({
      name, plan, use, due,
      usePct: pct + '%',
      status: S[st][0], statusBg: S[st][1], statusFg: S[st][2],
      hasAction: !!A[st], action: A[st], aria: A[st] + ' · ' + name,
      divider: i === 0 ? '0' : '1px solid #F1EDE6'
    }));
    return { accent, chips, rows };
  }
}
</script>
</body>
</html>
